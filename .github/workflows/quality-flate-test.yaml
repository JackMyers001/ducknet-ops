---
name: Quality - Flate Test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/quality-flate-test.yaml
      - kubernetes/**

permissions: {}

jobs:
  test:
    name: Flate Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flate
        uses: home-operations/flate/action@6664ea2690ed8465d59a4bdc82109ffb6b4d4f63 # v0.6.2
        with:
          cache: true

      - name: Run Flate test
        env:
          FLATE_PATH: kubernetes/flux/cluster
        run: flate test all --allow-missing-secrets
