---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
# Omni generates this cluster's config with its initial (pre-1.14) Talos version contract,
# so Kubernetes components must be configured via the legacy v1alpha1 fields here rather
# than the newer Kube*Config documents, or Talos rejects the config as conflicting.
cluster:
  controllerManager:
    extraArgs:
      bind-address: "::"
  etcd:
    advertisedSubnets:
      - ${IPV6_BASE}::/48
    extraArgs:
      listen-metrics-urls: http://[::]:2381
  network:
    $patch: delete
  proxy:
    # TODO: change to `KubeProxyConfig` once Omni stops overwriting a `delete` patch
    disabled: true
  scheduler:
    extraArgs:
      bind-address: "::"
machine:
  features:
    hostDNS:
      $patch: delete
  nodeLabels:
    $patch: delete
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - ${IPV6_BASE}:6900::/56
serviceSubnets:
  - fd00:10:96::/112
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - ${IPV6_BASE}::/48
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: controlplane-metrics
portSelector:
  ports:
    - 2381 # etcd
    - 10257 # kube-controller-manager
    - 10259 # kube-scheduler
  protocol: tcp
ingress:
  - subnet: ${IPV6_BASE}:6900::/56
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: ${IPV6_BASE}:1020::1
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv6.conf.onboard/60.accept_ra: "0"
  net.ipv6.conf.onboard/70.accept_ra: "0"
  net.ipv6.conf.onboard/60.autoconf: "0"
  net.ipv6.conf.onboard/70.autoconf: "0"
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
# yaml-language-server: $schema=https://docs.siderolabs.com/talos/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-hostpath
provisioning:
  diskSelector:
    match: system_disk
  minSize: 250GB
  grow: true
