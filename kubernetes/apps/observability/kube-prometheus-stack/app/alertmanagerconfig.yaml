---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: pushover
    groupBy:
      - alertname
      - namespace
      - severity
    groupWait: 1m
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: healthchecks-io
        groupWait: 0s
        groupInterval: 2m
        repeatInterval: 2m30s
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =

  # Same as the kube-prometheus-stack defaults
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning|info
          matchType: =~
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: severity
          value: warning
          matchType: =
      targetMatch:
        - name: severity
          value: info
          matchType: =
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: =
      targetMatch:
        - name: severity
          value: info
          matchType: =
      equal:
        - namespace

  receivers:
    - name: blackhole

    - name: healthchecks-io
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: HEALTHCHECKS_IO_URL

    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          monospace: false
          # Critical: high priority (bypasses quiet hours), warning: normal, resolved: silent
          priority: |-
            {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}{{ else }}-1{{ end }}
          sendResolved: true
          sound: |-
            {{ if eq .CommonLabels.severity "critical" }}siren{{ else }}gamelan{{ end }}
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
