---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: duckcraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 1h
  values:
    image:
      repository: itzg/minecraft-server
      tag: 2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776

    minecraftServer:
      eula: "TRUE"
      version: "26.3"
      type: FABRIC

      difficulty: hard
      ops: duckworld
      maxPlayers: 20
      gameMode: survival
      motd: DuckCraft

      memory: 8192M
      jvmXXOpts: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch

      modrinth:
        projects:
          # Core
          - fabric-api:0.165.0+26.3
          - lithostitched:2.0.6-fabric-26.3
          - no-chat-reports:Fabric-26.3-v2.21.0
          - proxy-protocol-support:1.2.2-fabric

          # Optimisation
          - c2me-fabric:0.4.2-alpha.0.106+26.3
          - ferrite-core:9.0.0-fabric
          - lithium:mc26.3-0.26.2-fabric
          - krypton:0.3.2
          - scalablelux:0.3.0-alpha.0.6+26.3

          # o11y
          - fabricexporter:tuPsGk8g
          - spark:1.10.187-fabric

          # World Generation
          - incendium:5.5.4+26.3
          - nullscape:2.0.1+26.3
          - terralith:2.6.5+26.3

          # Misc
          - appleskin:PHjDtQay
          - distanthorizons:3.3.4-26.3

      vanillaTweaksShareCodes:
        - VrvBBu # Double Shulker Shells v1.3.18
        - XG3IJf # Track Statistics v1.1.20
        - JoVezc # Track Raw Statistics v1.7.14
        - 3wHtwj # Unlock All Recipes v2.0.19

      extraEnv:
        PREFER_IPv6: "true"

      extraPorts:
        - name: metrics
          containerPort: 25585
          protocol: TCP
          service:
            enabled: true
            port: 9100

    serviceAnnotations:
      mc-router.itzg.me/externalServerName: duckcraft.mc.${DOMAIN_DN}

    resources:
      requests:
        cpu: 2000m
        memory: 10Gi

    extraVolumes:
      - volumes:
          - name: config
            configMap:
              name: duckcraft-config
        volumeMounts:
          - name: config
            mountPath: /config
            readOnly: true

    persistence:
      dataDir:
        enabled: true
        existingClaim: duckcraft

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
