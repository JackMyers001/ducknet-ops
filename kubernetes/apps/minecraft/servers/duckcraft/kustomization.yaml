---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: duckcraft-config
    files:
      - proxy_protocol_support.json=./resources/proxy_protocol_support.json
generatorOptions:
  disableNameSuffixHash: true
