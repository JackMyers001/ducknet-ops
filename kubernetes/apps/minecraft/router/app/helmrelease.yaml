---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 1h
  values:
    image:
      repository: itzg/mc-router
      tag: 1.45.1@sha256:c0ba7037de0d2d91e093da1cbe528bb1ec0806abd4de8442d44092f4f39fe94e

    minecraftRouter:
      useProxyProtocol: true

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 100Mi

    services:
      minecraft:
        type: LoadBalancer
        annotations:
          "io.cilium/lb-ipam-ips": "${IPV6_BASE}:fff0::21"
