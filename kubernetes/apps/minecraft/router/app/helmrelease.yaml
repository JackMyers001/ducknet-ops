---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 1h
  values:
    image:
      repository: ghcr.io/jackmyers001/mc-router
      tag: 1.49.0-nat64-85f901f@sha256:8d6cf0576459b5075bed6309b8129a15a05733dc479dc2d3edb233eabbcd9b90

    extraEnv:
      NAT64_PREFIXES: 64:ff9b:1::/96

    minecraftRouter:
      useProxyProtocol: true

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 100Mi

    services:
      minecraft:
        type: LoadBalancer
        annotations:
          "io.cilium/lb-ipam-ips": "${IPV6_BASE}:fff0::21"
