---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 1h
  values:
    image:
      repository: itzg/mc-router
      tag: 1.48.0@sha256:3a9ece070b97c8c55666810fc81cb209e1dd775fce792187e296626b786859cc

    minecraftRouter:
      useProxyProtocol: true

    resources:
      requests:
        cpu: 100m
      limits:
        memory: 100Mi

    services:
      minecraft:
        type: LoadBalancer
        annotations:
          "io.cilium/lb-ipam-ips": "${IPV6_BASE}:fff0::21"
