---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mc-router
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mc-router

  ingress:
    # Players
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP

  egress:
    # Minecraft servers
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: minecraft
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP

    # Service discovery
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
