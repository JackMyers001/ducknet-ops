---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plex
  ingress:
    # Web (internal and external gateways)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Library refresh notifications
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: ["radarr", "sonarr"]
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP

  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"

    # HDHomeRun
    - toFQDNs:
        - matchName: hdhomerun.home.${DOMAIN_DN}
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "5004"
              protocol: TCP

    # The only internet access Plex gets. Anything else is dropped and alerted on by
    # PlexEgressDropped (prometheusrule.yaml). sentry.io (crash reports) is deliberately blocked.
    - toFQDNs:
        - matchName: plex.tv
        - matchPattern: "**.plex.tv"
        - matchPattern: "**.plex.bz"
        - matchPattern: "**.plexapp.com"
        - matchName: artworks.thetvdb.com
        - matchName: assets.fanart.tv
        - matchName: image.tmdb.org
        - matchName: secure.gravatar.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
