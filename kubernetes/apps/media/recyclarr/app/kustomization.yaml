---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - recyclarr.yml=./resources/recyclarr.yml
      - settings.yml=./resources/settings.yml
      - sonarr-webdl.json=./resources/custom-formats/sonarr/webdl.json
generatorOptions:
  disableNameSuffixHash: true
