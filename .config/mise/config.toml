[tools]
actionlint = "1.7.12"
"aqua:nushell/nushell" = "0.116.1"
bitwarden = "2026.5.0"
bitwarden-secrets-manager = "2.1.0"
"cargo:https://github.com/nushell/nufmt" = "rev:a24c2b1bc7f573b1a8b2c4a453e989407a4d29c8"
helm = "4.3.0"
hk = "2.7.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
oxfmt = "0.72.0"
pkl = "0.32.1"
vals = "0.47.0"

[tasks.lint]
run = "hk check --all --slow"

[tasks.lint-fix]
run = "hk fix --all --slow"

[settings]
lockfile = true
