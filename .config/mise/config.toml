[tools]
actionlint = "1.7.12"
"aqua:nushell/nushell" = "0.116.1"
bitwarden = "2026.5.0"
bitwarden-secrets-manager = "2.1.0"
"cargo:https://github.com/nushell/nufmt" = "tag:v0.1.6"
helm = "4.3.1"
hk = "2.11.1"
kubectl = "1.37.2"
kustomize = "5.8.3"
oxfmt = "0.75.0"
pkl = "0.32.2"
vals = "0.50.0"

[tasks.lint]
run = "hk check --all --slow"

[tasks.lint-fix]
run = "hk fix --all --slow"

[settings]
lockfile = true
