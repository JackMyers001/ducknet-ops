[tools]
actionlint = "1.7.12"
"aqua:nushell/nushell" = "0.117.0"
bitwarden = "2026.5.0"
bitwarden-secrets-manager = "2.1.0"
"github:nushell/nufmt" = "0.1.6"
helm = "4.3.2"
hk = "2.12.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
oxfmt = "0.78.0"
pkl = "0.33.0"
vals = "0.51.0"

[tasks.lint]
run = "hk check --all --slow"

[tasks.lint-fix]
run = "hk fix --all --slow"

[settings]
lockfile = true
